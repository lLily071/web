<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面即将跳转</title>
</head>
<body>
  <main>
    <h1>页面即将跳转</h1>
    <p><span id="countdown">3</span> 秒后前往新网站。</p>
    <p>如果没有自动跳转，请<a href="https://www.gzarts.edu.cn/">点击这里</a>。</p>
  </main>

  <script>
    const destination = "https://www.gzarts.edu.cn/";
    let remaining = 3;
    const countdown = document.querySelector("#countdown");

    const timer = setInterval(() => {
      remaining -= 1;
      countdown.textContent = remaining;

      if (remaining <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
